<svg viewBox="0 0 1000 712" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="s1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#1b1d1f"/></marker>
  </defs>
  <rect width="1000" height="712" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b1d1f">Diagrama de Sequência — Ação sobre o GitLab (com confirmação)</text>

  <!-- participantes -->
  <g text-anchor="middle">
    <rect x="35"  y="50" width="110" height="36" rx="8" fill="#e8eafc" stroke="#6C63E8" stroke-width="1.6"/><text x="90"  y="73" font-size="12.5" font-weight="600">Utilizador</text>
    <rect x="232" y="50" width="116" height="36" rx="8" fill="#fff3e6" stroke="#fc6d26" stroke-width="1.6"/><text x="290" y="73" font-size="12.5" font-weight="600">Chatbox (UI)</text>
    <rect x="444" y="50" width="112" height="36" rx="8" fill="#e8f7ee" stroke="#16a34a" stroke-width="1.6"/><text x="500" y="73" font-size="12.5" font-weight="600">Servidor</text>
    <rect x="656" y="50" width="108" height="36" rx="8" fill="#fdeaf3" stroke="#db2777" stroke-width="1.6"/><text x="710" y="73" font-size="12.5" font-weight="600">Groq (IA)</text>
    <rect x="854" y="50" width="112" height="36" rx="8" fill="#fff3e6" stroke="#fc6d26" stroke-width="1.6"/><text x="910" y="73" font-size="12.5" font-weight="600">GitLab API</text>
  </g>

  <!-- lifelines -->
  <g stroke="#c7cbd1" stroke-width="1.3" stroke-dasharray="4 4">
    <line x1="90"  y1="86" x2="90"  y2="664"/>
    <line x1="290" y1="86" x2="290" y2="664"/>
    <line x1="500" y1="86" x2="500" y2="664"/>
    <line x1="710" y1="86" x2="710" y2="664"/>
    <line x1="910" y1="86" x2="910" y2="664"/>
  </g>

  <!-- mensagens -->
  <g font-size="11.5" fill="#1b1d1f" text-anchor="middle">
    <!-- 1 -->
    <text x="190" y="113">1. «dá a issue #5 como terminada»</text>
    <line x1="90" y1="120" x2="288" y2="120" stroke="#1b1d1f" stroke-width="1.5" marker-end="url(#s1)"/>
    <!-- 2 -->
    <text x="395" y="151">2. POST /api/chat (+ contexto)</text>
    <line x1="290" y1="158" x2="498" y2="158" stroke="#1b1d1f" stroke-width="1.5" marker-end="url(#s1)"/>
    <!-- 3 -->
    <text x="605" y="189">3. prompt + ferramentas</text>
    <line x1="500" y1="196" x2="708" y2="196" stroke="#1b1d1f" stroke-width="1.5" marker-end="url(#s1)"/>
    <!-- 4 (return) -->
    <text x="605" y="227">4. tool_call: close_issue(5)</text>
    <line x1="710" y1="234" x2="502" y2="234" stroke="#5b6675" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#s1)"/>
    <!-- 5 (return) -->
    <text x="395" y="265">5. propõe ação (NÃO executa)</text>
    <line x1="500" y1="272" x2="292" y2="272" stroke="#5b6675" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#s1)"/>
    <!-- 6 -->
    <text x="190" y="303">6. cartão de confirmação</text>
    <line x1="290" y1="310" x2="92" y2="310" stroke="#1b1d1f" stroke-width="1.5" marker-end="url(#s1)"/>
  </g>

  <!-- ponto de controlo humano -->
  <rect x="30" y="328" width="940" height="34" rx="8" fill="#fff8e1" stroke="#d97706" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="500" y="350" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">🔒 Ponto de controlo humano — nada é escrito no GitLab antes desta aprovação</text>

  <g font-size="11.5" fill="#1b1d1f" text-anchor="middle">
    <!-- 7 -->
    <text x="190" y="385">7. confirma ✓</text>
    <line x1="90" y1="392" x2="288" y2="392" stroke="#16a34a" stroke-width="1.8" marker-end="url(#s1)"/>
    <!-- 8 -->
    <text x="395" y="417">8. POST /api/confirm-action</text>
    <text x="395" y="431" font-size="10.5" fill="#5b6675">(+ chave de acesso)</text>
    <line x1="290" y1="438" x2="498" y2="438" stroke="#1b1d1f" stroke-width="1.5" marker-end="url(#s1)"/>
  </g>

  <!-- validação da chave de acesso no servidor (antes de qualquer escrita) -->
  <rect x="392" y="452" width="216" height="38" rx="6" fill="#e8f7ee" stroke="#16a34a" stroke-width="1.3"/>
  <text x="500" y="468" text-anchor="middle" font-size="11.5" font-weight="600" fill="#15803d">valida a chave de acesso</text>
  <text x="500" y="483" text-anchor="middle" font-size="10.5" fill="#5b6675">sem chave válida → 403, nada é escrito</text>

  <g font-size="11.5" fill="#1b1d1f" text-anchor="middle">
    <!-- 9 -->
    <text x="705" y="513">9. PUT issues/5 (close)</text>
    <line x1="500" y1="520" x2="908" y2="520" stroke="#1b1d1f" stroke-width="1.5" marker-end="url(#s1)"/>
    <!-- 10 (return) -->
    <text x="705" y="551">10. 200 OK</text>
    <line x1="910" y1="558" x2="502" y2="558" stroke="#5b6675" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#s1)"/>
    <!-- 11 (return) -->
    <text x="395" y="589">11. resultado</text>
    <line x1="500" y1="596" x2="292" y2="596" stroke="#5b6675" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#s1)"/>
    <!-- 12 -->
    <text x="190" y="627">12. «issue #5 fechada ✓»</text>
    <line x1="290" y1="634" x2="92" y2="634" stroke="#16a34a" stroke-width="1.8" marker-end="url(#s1)"/>
  </g>

  <text x="500" y="692" text-anchor="middle" font-size="11" fill="#aab0b8">Figura X — Diagrama de Sequência (ação com confirmação). Linha tracejada = resposta/retorno.</text>
</svg>
