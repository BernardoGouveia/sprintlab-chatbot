<svg viewBox="0 0 1020 250" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#5b6675"/></marker>
  </defs>
  <rect width="1020" height="250" fill="#ffffff"/>
  <text x="510" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1d1f">BPMN As-Is — Gerir o GitLab manualmente</text>

  <!-- start -->
  <circle cx="40" cy="120" r="18" fill="#e8f7ee" stroke="#16a34a" stroke-width="2.4"/>

  <g text-anchor="middle">
    <!-- tasks -->
    <rect x="72"  y="91" width="150" height="58" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="147" y="115" font-size="11.5" fill="#1b1d1f">Sair do Teams,</text>
    <text x="147" y="131" font-size="11.5" fill="#1b1d1f">abrir o navegador</text>

    <rect x="255" y="91" width="150" height="58" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="330" y="115" font-size="11.5" fill="#1b1d1f">Autenticar e</text>
    <text x="330" y="131" font-size="11.5" fill="#1b1d1f">navegar no GitLab</text>

    <rect x="438" y="91" width="150" height="58" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="513" y="115" font-size="11.5" fill="#1b1d1f">Localizar o</text>
    <text x="513" y="131" font-size="11.5" fill="#1b1d1f">projeto / a issue</text>

    <rect x="621" y="91" width="150" height="58" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="696" y="115" font-size="11.5" fill="#1b1d1f">Consultar ou</text>
    <text x="696" y="131" font-size="11.5" fill="#1b1d1f">alterar manualmente</text>

    <rect x="804" y="91" width="150" height="58" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="879" y="115" font-size="11.5" fill="#1b1d1f">Regressar ao Teams</text>
    <text x="879" y="131" font-size="11.5" fill="#1b1d1f">para comunicar</text>
  </g>

  <!-- end -->
  <circle cx="988" cy="120" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="3.4"/>

  <!-- arrows -->
  <g stroke="#5b6675" stroke-width="1.6" marker-end="url(#a1)">
    <line x1="58" y1="120" x2="70" y2="120"/>
    <line x1="222" y1="120" x2="253" y2="120"/>
    <line x1="405" y1="120" x2="436" y2="120"/>
    <line x1="588" y1="120" x2="619" y2="120"/>
    <line x1="771" y1="120" x2="802" y2="120"/>
    <line x1="954" y1="120" x2="968" y2="120"/>
  </g>

  <text x="510" y="186" text-anchor="middle" font-size="12.5" font-weight="600" fill="#dc2626">↻ 4 mudanças de contexto — processo fragmentado, fora do fluxo de conversação</text>
  <text x="510" y="232" text-anchor="middle" font-size="11" fill="#aab0b8">Figura X — Diagrama BPMN As-Is</text>
</svg>
